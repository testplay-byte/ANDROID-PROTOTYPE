# .github/workflows/build-setup-wizard-apk.yml
# Builds the Setup Wizard APK and uploads it as a GitHub Actions artifact.
# The APK is debug-signed (auto-signed with the debug keystore).
#
# To download the APK:
# 1. Go to the Actions tab on GitHub
# 2. Click the latest "Build Setup Wizard APK" run
# 3. Scroll down to "Artifacts" → download "setup-wizard-apk"
#    (or "build-log" if the build failed, to see compilation errors)

name: Build Setup Wizard APK

on:
  push:
    branches: [main]
    paths:
      - 'Android_app/SetupWizard/**'
      - '.github/workflows/build-setup-wizard-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: Android_app/SetupWizard
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build-output.log 2>&1
          BUILD_EXIT_CODE=$?
          echo "Build exit code: $BUILD_EXIT_CODE"
          # Show last 100 lines of the log
          tail -100 build-output.log
          exit $BUILD_EXIT_CODE

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: setup-wizard-apk
          path: Android_app/SetupWizard/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: Android_app/SetupWizard/build-output.log
          retention-days: 7
